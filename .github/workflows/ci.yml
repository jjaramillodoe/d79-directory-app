name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # src/lib/auth.js throws at import time without this, which would fail the build
      # before it compiled anything. This is a throwaway value for CI only.
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-for-real-sessions
      # No database or Redis is reachable from CI. Both clients degrade rather than
      # throw, so the build still completes; these keep the failure paths predictable.
      MONGODB_URI: mongodb://127.0.0.1:27017/d79-directory-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
