name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Throwaway value so NextAuth has a secret if a test or the build evaluates
      # authOptions. Preview/production must set the real secret in Vercel.
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-for-real-sessions
      # No database or Redis is reachable from CI. Both clients degrade rather than
      # throw, so the build still completes; these keep the failure paths predictable.
      MONGODB_URI: mongodb://127.0.0.1:27017/d79-directory-ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Type checking runs twice on purpose. `typecheck` is the strict gate over the .ts
      # sources, which are clean. `typecheck:js` is a ratchet over the .js sources, which are
      # not yet: it fails only if the error count moves off the committed baseline in either
      # direction, so new type errors cannot land and fixes cannot go unrecorded.
      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (JS ratchet)
        run: npm run typecheck:js

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
